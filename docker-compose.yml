services:
  redis:
    image: redis:alpine
    container_name: ai_vsg_redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: ai_vsg_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_vsg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_vsg"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_vsg_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_vsg_backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ai_vsg
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./backend:/app/backend
      - ./preprocessing:/app/preprocessing
      - ./outputs:/app/outputs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_vsg_celery_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ai_vsg
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./backend:/app/backend
      - ./preprocessing:/app/preprocessing
      - ./outputs:/app/outputs
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A preprocessing.celery_app worker --loglevel=info
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_vsg_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: always

  flower:
    image: mher/flower:latest
    container_name: ai_vsg_flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  qdrant_data:
